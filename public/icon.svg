<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <linearGradient id="vGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#vGlow)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Vixy Wings / Dynamic V Icon -->
  <path d="M 120 140 L 256 380 L 392 140 L 312 140 L 256 260 L 200 140 Z" fill="url(#vGlow)"/>
  
  <!-- Taxi Badge / Crown Indicator -->
  <path d="M 216 110 L 256 80 L 296 110 L 280 130 L 232 130 Z" fill="url(#goldAccent)"/>

  <!-- Speed Pulse Line -->
  <circle cx="256" cy="380" r="14" fill="#a855f7"/>
  <circle cx="256" cy="380" r="28" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="6 6"/>
</svg>
